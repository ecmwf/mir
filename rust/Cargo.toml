[workspace]
resolver = "2"
members = ["crates/mir-sys"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ecmwf/mir"
rust-version = "1.90"
readme = "README.md"
keywords = ["ecmwf", "weather", "meteorology", "interpolation", "regridding"]
categories = ["science"]

[workspace.dependencies]
# Internal
mir-sys = { version = "1.30", path = "crates/mir-sys", default-features = false }

# Foundation crates
eckit-sys = { version = "2.5", default-features = false }
eccodes-sys = { version = "2.50", default-features = false }
atlas-sys = { version = "0.47", default-features = false }
metkit-sys = { version = "1.22", default-features = false }

# Build tools
bindman = "0.2"
bindman-build = "0.2"
bindman-utils = "0.2"

# External
cxx = "1.0"
cxx-build = "1.0"
thiserror = "2"
