[generated]
header = """
# SPDX-FileCopyrightText: 1996- European Centre for Medium-Range Weather Forecasts (ECMWF)
# SPDX-License-Identifier: Apache-2.0
"""

[package]
name = "mir"
repo = "ecmwf/mir"
visibility = "public"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/ecbuild"
package = "ecbuild"
ref = "develop"
compiler-inputs = []

[[deps]]
repo = "ecmwf/stack-dependencies"
package = ["netcdf", "netcdf_cxx4"]
ref = "master"
compiler-inputs = ["cxx-compiler"]

[[deps]]
repo = "ecmwf/eckit"
package = "eckit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]

# mir needs eckit_geo in eccodes and metkit's GRIB2MARS/MARS2GRIB, so its legs
# are limited to where those builds exist.
[[deps]]
repo = "ecmwf/eccodes"
package = "eccodes"
ref = "develop"
compiler-inputs = ["cxx-compiler"]
options = "eckit-geo"

[[deps]]
repo = "ecmwf/metkit"
package = "metkit"
ref = "develop"
compiler-inputs = ["cxx-compiler"]
options = "eckit-geo"

[[deps]]
repo = "ecmwf/atlas"
package = "atlas"
ref = "develop"
compiler-inputs = ["cxx-compiler"]

[matrix.build]
triggers = ["upstream-change", "rebuild-request"]

[matrix.build.defaults]
job-script = "./.ci/runner/build.sh.j2"
build-type = "RelWithDebInfo"
runs-on = "arc-runner-very-large"
cxx-compiler = "g++-13"
c-compiler = "gcc-13"
container = "eccr.ecmwf.int/public-ci-images/ubuntu24.04-gcc13-gfortran13"
platform = "ubuntu-24.04"

[[matrix.build.include]]
options = ""

[[matrix.build.include]]
options = "python"
job-script = "./.ci/runner/python.sh.j2"
python-version = "3.12"

[matrix.build-hpc]
execution = "hpc-atos"
container-credentials = true
triggers = ["upstream-change", "rebuild-request"]

[matrix.build-hpc.defaults]
job-script = "./.ci/hpc/build.sh.j2"
cxx-compiler = "g++-8"
build-type = "RelWithDebInfo"
runs-on = "hpc-submit"
container = "eccr.ecmwf.int/private-ci-images/ubuntu24.04-internal-tools"
site = "hpc-batch"
platform = "hpc-atos-gnu"
# gcc/old, not a version number: as of now gives you 8.5.0
# `module avail gcc` lists no 8.5.0 to pin directly.
modules = ["load prgenv/gnu", "unload gcc", "load gcc/old", "load cmake", "load ninja"]
c_compiler_binary = "gcc"
cxx_compiler_binary = "g++"
time = "01:00:00"

[[matrix.build-hpc.include]]
options = ""
